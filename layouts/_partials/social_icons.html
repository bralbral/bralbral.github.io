<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{- if eq .name "artifacthub" }}
        <img class="social-icon-image" src="{{ "images/artifact-hub.svg" | relURL }}" alt="Artifact Hub">
        {{- else if eq .name "dockerhub" }}
        <img class="social-icon-image" src="{{ "images/docker-hub.svg" | relURL }}" alt="Docker Hub">
        {{- else }}
        {{ partial "svg.html" . }}
        {{- end }}
    </a>
    {{- end }}
</div>
